<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Healthify</title>
    <!-- Title Tag -->
    <title>
      HealthStation24 | Doctor-Approved BMI Calculator, Fitness, Nutrition,
      Weight Loss & Wellness Tips
    </title>

    <!-- Meta Description -->
    <meta
      name="description"
      content="HealthStation24 provides trusted, doctor-approved BMI calculators, workout plans, healthy eating guides, weight loss strategies, and nutrition tips to help you achieve your fitness and wellness goals."
    />

    <!-- Meta Keywords -->
    <meta
      name="keywords"
      content="HealthStation24, BMI calculator, body mass index calculator, fitness tips, workout plans, exercise routines, nutrition advice, healthy eating, diet plans, weight loss, fat loss, wellness blog, doctor-approved health tips, healthy lifestyle, calorie calculator, fitness motivation"
    />

    <!-- Viewport -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Robots -->
    <meta name="robots" content="index, follow" />
    <!-- Open Graph Meta Tags -->
    <meta
      property="og:title"
      content="HealthStation24 | Your Trusted Source for Health & Wellness"
    />
    <meta
      property="og:description"
      content="Explore BMI tools, fitness routines, and nutrition guides from HealthStation24—curated by medical professionals."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.healthstation24.com" />
    <meta
      property="og:image"
      content="https://www.healthstation24.com/logo.png"
    />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "HealthStation24",
        "url": "https://healthstation24.com"
      }
      </script>
    <script>
      // Apply theme before loader shows
      (function () {
        const theme = localStorage.getItem("vite-ui-theme");
        if (
          theme === "dark" ||
          (!theme && window.matchMedia("(prefers-color-scheme: dark)").matches)
        ) {
          document.documentElement.classList.add("dark");
        }
      })();
    </script>
    <style>
      /* CSS Variables for loader */
      :root {
        --radius: 0.5rem;
        --background: oklch(1 0 0);
        --muted: oklch(0.97 0 0);
      }

      .dark {
        --background: oklch(0.145 0 0);
        --muted: oklch(0.269 0 0);
      }

      /* Custom loader styles */
      #initial-loader {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: var(--background);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 9999;
      }

      .loader-logo {
        width: 80px;
        height: 80px;
        border-radius: var(--radius);
        background: var(--muted);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 12px;
        animation: pulse 2s infinite;
        overflow: hidden;
      }

      .loader-logo img {
        width: 100%;
        height: 100%;
        object-fit: contain;
      }

      @keyframes pulse {
        0%,
        100% {
          transform: scale(1);
        }
        50% {
          transform: scale(1.05);
        }
      }

      /* Hide loader when React app loads */
      .app-loaded #initial-loader {
        display: none;
      }
    </style>
  </head>
  <body>
    <div id="initial-loader">
      <div class="loader-logo">
        <img src="/logo.png" alt="Healthify Logo" />
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
